name: CI

on:
  push:
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt -r test/integration/requirements.txt
      - name: Run native unit tests
        working-directory: test
        run: |
          python3 run_native_tests.py
          python3 -m compileall ../src ../test
      - name: Test browser preview dispatcher
        run: python3 .github/scripts/test_dispatch_browser_preview.py

  tests:
    # MicroPython Unix frozen-import smoke currently segfaults on Ubuntu 26.04;
    # pin the last verified runner until compatibility is fixed upstream.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libgmp-dev \
            libreadline-dev \
            libsdl2-dev \
            pkg-config \
            python3
      - name: Run tests
        run: make test

  # PR firmware and browser builds live in the paired Web Simulator service.
  # Keep a standalone firmware build only for pushes to the protected branch.
  default-branch-firmware:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
      - name: Build Unix simulator and STM32 firmware
        run: |
          nix develop -c make unix
          nix develop -c make disco
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            bin/specter-diy.bin
            bin/specter-diy.hex
