name: Publish browser simulator

# Publish only from the trusted workflow_run context in this repository. The
# reusable implementation lives in the simulator repository; Pages and PR
# permissions remain scoped to this caller.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  resolve:
    name: Resolve simulator tooling commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      simulator_commit: ${{ steps.resolve.outputs.simulator_commit }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download build target from the triggering run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-target
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: build-target
      - name: Resolve the simulator tooling commit
        id: resolve
        env:
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BUILD_EVENT: ${{ github.event.workflow_run.event }}
          BUILD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_FILE: build-target/target.json
          SIMULATOR_REPOSITORY: cryptoadvance/specter-diy-web-simulator
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/simulator/resolve_publisher_target.py

  publish:
    needs: resolve
    if: needs.resolve.outputs.should_publish == 'true'
    uses: cryptoadvance/specter-diy-web-simulator/.github/workflows/publish-browser.yml@main
    with:
      simulator_repository: cryptoadvance/specter-diy-web-simulator
      simulator_commit: ${{ needs.resolve.outputs.simulator_commit }}
