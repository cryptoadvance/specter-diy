name: Publish browser simulator

on:
  workflow_run:
    workflows: [Browser Simulator]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: browser-pages-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: github-pages
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
      pages: write
      id-token: write
    env:
      # Same immutable dependency as browser-simulator.yml. Update both pins
      # only after reviewing the new Web Simulator commit and its build code.
      WEB_SIMULATOR_SHA: 95bfa2ec09badfe29b8e5a30a0f674c996b19af0
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out protected Specter publisher code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up trusted Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Check out pinned Web Simulator shell as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cryptoadvance/specter-diy-web-simulator
          ref: ${{ env.WEB_SIMULATOR_SHA }}
          path: simulator-tools
          persist-credentials: false
      - name: Prepare the gh-pages worktree
        run: |
          git fetch origin gh-pages || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi
          git -C pages config user.name 'github-actions[bot]'
          git -C pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Validate artifacts, update or remove the current preview
        id: prepare
        run: >-
          python3 .github/simulator/publish_preview.py prepare
          --event "$GITHUB_EVENT_PATH"
          --pages pages
          --trusted-web simulator-tools/web
          --artifacts-root "$RUNNER_TEMP/specter-browser-artifacts"
          --state "$RUNNER_TEMP/specter-browser-state.json"
          --simulator-sha "$WEB_SIMULATOR_SHA"
      - name: Recheck the live source and preview ordering before publication
        id: recheck
        if: steps.prepare.outputs.publish == 'true'
        run: >-
          python3 .github/simulator/publish_preview.py recheck
          --pages pages
          --state "$RUNNER_TEMP/specter-browser-state.json"
          --simulator-sha "$WEB_SIMULATOR_SHA"
      - name: Commit the validated gh-pages update
        if: steps.recheck.outputs.publish == 'true'
        run: |
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "Update browser preview from run ${{ github.event.workflow_run.id }}"
            git -C pages push origin HEAD:gh-pages
          fi
      - name: Stage the static Pages site
        id: stage
        if: steps.recheck.outputs.publish == 'true' && steps.recheck.outputs.deploy == 'true'
        run: >-
          python3 .github/simulator/publish_preview.py stage
          --pages pages
          --output site-dist
          --state "$RUNNER_TEMP/specter-browser-state.json"
      - name: Upload Pages content
        id: pages-artifact
        if: steps.stage.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site-dist
      - name: Deploy Pages
        id: pages-deploy
        if: steps.pages-artifact.outcome == 'success'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Update the current PR comment
        if: always() && steps.recheck.outputs.publish == 'true'
        env:
          PAGES_DEPLOYED: ${{ steps.pages-deploy.outcome == 'success' }}
        run: >-
          python3 .github/simulator/publish_preview.py comment
          --state "$RUNNER_TEMP/specter-browser-state.json"
