name: Publish browser simulator

# Only this default-branch workflow receives write and Pages permissions.
# The pinned publisher reads PR artifacts as hostile data and runs trusted code.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  publish:
    uses: cryptoadvance/specter-diy-web-simulator/.github/workflows/publish-browser.yml@be15b999952e69de73b6aaede355cb4d7619bd4e
    with:
      simulator_repository: cryptoadvance/specter-diy-web-simulator
      simulator_commit: be15b999952e69de73b6aaede355cb4d7619bd4e
