name: Publish browser simulator

# Only this default-branch workflow receives write and Pages permissions.
# The pinned publisher reads PR artifacts as hostile data and runs trusted code.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      simulator_commit: ${{ steps.resolve.outputs.simulator_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download build target metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name build-target --dir build-target
      - name: Resolve simulator main and validate the build target pin
        id: resolve
        env:
          BUILD_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          BUILD_EVENT: ${{ github.event.workflow_run.event }}
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TARGET_FILE: build-target/target.json
          SIMULATOR_REPOSITORY: cryptoadvance/specter-diy-web-simulator
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/simulator/resolve_publisher_target.py

  publish:
    needs: resolve
    uses: cryptoadvance/specter-diy-web-simulator/.github/workflows/publish-browser.yml@05256b9068dded056d88ee9555688c03979a9584
    with:
      simulator_repository: cryptoadvance/specter-diy-web-simulator
      simulator_commit: ${{ needs.resolve.outputs.simulator_commit }}
