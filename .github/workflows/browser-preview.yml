name: Browser simulator preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: browser-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Dispatch and report browser preview
    if: github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out trusted default-branch dispatcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned commit
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Dispatch to the paired Web Simulator and update the PR comment
        env:
          BASE_REPOSITORY: ${{ github.event.repository.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          SOURCE_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          ACTION: ${{ github.event.action == 'closed' && 'delete' || 'build' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
          WEB_SIMULATOR_DISPATCH_TOKEN: ${{ secrets.WEB_SIMULATOR_DISPATCH_TOKEN }}
          WEB_SIMULATOR_REPOSITORY: ${{ vars.WEB_SIMULATOR_REPOSITORY }}
        run: python3 .github/scripts/dispatch_browser_preview.py
