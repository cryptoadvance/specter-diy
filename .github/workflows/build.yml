name: Build

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to build
        required: true
        type: number
      head_sha:
        description: Current PR head SHA (7 to 40 hexadecimal characters)
        required: true
        type: string

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual PR {0} {1}', inputs.pr_number, inputs.head_sha) || github.event_name == 'pull_request' && format('PR {0} {1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.sha }}

permissions:
  contents: read

jobs:
  target:
    name: Record workflow target
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.commit }}
      repository: ${{ steps.resolve.outputs.repository }}
      number: ${{ steps.resolve.outputs.number }}
      simulator_repository: ${{ steps.resolve.outputs.simulator_repository }}
      simulator_commit: ${{ steps.resolve.outputs.simulator_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record exact source and approved simulator commit
        id: resolve
        env:
          TARGET_EVENT: ${{ github.event_name }}
          TARGET_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number || 0 }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          TARGET_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          TARGET_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          TARGET_BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          TARGET_SIMULATOR_REPOSITORY: cryptoadvance/specter-diy-web-simulator
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/simulator/resolve_build_target.py
      - uses: actions/upload-artifact@v4
        with:
          name: build-target
          if-no-files-found: error
          path: target.json

  build:
    name: Build firmware from exact source commit
    runs-on: ubuntu-latest
    needs: target
    env:
      EXPECTED_SHA: ${{ needs.target.outputs.sha }}
      SPECTER_SOURCE_REPOSITORY: ${{ needs.target.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.target.outputs.repository }}
          ref: ${{ needs.target.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Check out resolved simulator tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.target.outputs.simulator_repository }}
          ref: ${{ needs.target.outputs.simulator_commit }}
          path: simulator-tools
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Build Unix simulator and STM32 firmware
        run: |
          nix develop -c make unix
          nix develop -c make disco
          nix develop -c make test
      - name: Record firmware provenance
        env:
          SIMULATOR_REPOSITORY: cryptoadvance/specter-diy-web-simulator
          SIMULATOR_COMMIT: ${{ needs.target.outputs.simulator_commit }}
        run: python3 simulator-tools/web/tools/source_info.py firmware
      - name: Upload firmware binaries
        id: firmware-upload
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          if-no-files-found: error
          path: |
            bin/specter-diy.bin
            bin/specter-diy.hex
            source.json
      - name: Add firmware download to workflow summary
        env:
          ARTIFACT_URL: ${{ steps.firmware-upload.outputs.artifact-url }}
        run: |
          echo "## Specter firmware" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the tested firmware artifact]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: Build and smoke-test browser simulator
    needs: target
    uses: cryptoadvance/specter-diy-web-simulator/.github/workflows/browser-simulator.yml@main
    with:
      source_repository: ${{ needs.target.outputs.repository }}
      source_commit: ${{ needs.target.outputs.sha }}
      simulator_repository: ${{ needs.target.outputs.simulator_repository }}
      simulator_commit: ${{ needs.target.outputs.simulator_commit }}
      pr_number: ${{ fromJSON(needs.target.outputs.number) }}
